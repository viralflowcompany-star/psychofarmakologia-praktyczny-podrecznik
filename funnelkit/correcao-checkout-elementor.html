  @media (max-width: 767px) {

    body.elementor-page-856 .elementor-element-97cf2c6 img {

    .pf-checkout-clean {

    }

    .pf-checkout-clean .wfacp_main_form,
    .pf-checkout-clean form.checkout {

    .pf-checkout-clean .wfob_title {

    }

    .pf-checkout-trust {
      grid-template-columns: 1fr;
    }

    .pf-checkout-trust__item {

    }

</style>

<div class="pf-checkout-clean">
  [wfacp_gutenberg_checkout_form uniqueID=ac36544b]

  <div class="pf-checkout-trust" aria-label="Bezpieczne zakupy">
    <div class="pf-checkout-trust__item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>30-dniowa gwarancja zwrotu pieniędzy</span>
    </div>
    <div class="pf-checkout-trust__item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>Natychmiastowy dostęp po płatności</span>
    </div>
    <div class="pf-checkout-trust__item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.4 2.8 8.1 7 10 4.2-1.9 7-5.6 7-10V6l-7-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span>Bezpieczna i szyfrowana płatność</span>
    </div>
  </div>

  <p class="pf-checkout-copyright">© 2026 Digital Select. Wszelkie prawa zastrzeżone.</p>
</div>

<script>
  (function () {
    var bumpTitles = {
      wfob_wrapper_858: '<span>Tak!</span> Dodaj Atlas Monitorowania Laboratoryjnego do mojego zamówienia',
      wfob_wrapper_859: '<span>Tak!</span> Dodaj Bank Przypadków Klinicznych do mojego zamówienia',
      wfob_wrapper_860: '<span>Tak!</span> Dodaj Psychofarmakologię Dzieci i Młodzieży do mojego zamówienia'
    };

    function applyCheckoutFixes() {
      Object.keys(bumpTitles).forEach(function (id) {
        var label = document.querySelector('#' + id + ' .wfob_title');
        if (label && label.innerHTML !== bumpTitles[id]) {
          label.innerHTML = bumpTitles[id];
        }
      });

      var privacyText = document.querySelector('.wfacp-payment-dec');
      if (privacyText) {
        privacyText.textContent = 'Szanujemy Twoją prywatność i chronimy Twoje dane.';
      }

      document.title = 'Finalizacja zamówienia – Praktyczny Podręcznik Psychofarmakologii';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', applyCheckoutFixes);
    } else {
      applyCheckoutFixes();
    }

    if (window.jQuery) {
      window.jQuery(document.body).on('updated_checkout', applyCheckoutFixes);
    }
  })();
</script>
