<style>

    max-width: 440px;
    margin: 26px 0 30px;
    color: #596174;
    font-size: 17px;
    line-height: 1.7;
  }

  .pfk-thankyou__button {
    width: 100%;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 24px;
    color: #fff !important;
    background: var(--pfk-green);
    border-radius: 999px;
    box-shadow: 0 13px 26px rgba(45, 162, 58, .2);
    font-size: 16px;
    font-weight: 800;
    line-height: 1.2;
    text-align: center;
    text-decoration: none !important;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }

  .pfk-thankyou__button:hover {
    color: #fff !important;
    background: var(--pfk-green-dark);
    box-shadow: 0 16px 30px rgba(45, 162, 58, .25);
    transform: translateY(-2px);
  }

  .pfk-thankyou__button:focus-visible {
    outline: 3px solid rgba(2, 11, 120, .28);
    outline-offset: 4px;
  }

  .pfk-thankyou__button svg {
    display: block;
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
  }

  .pfk-thankyou__note {
    align-self: center;
    max-width: 360px;
    margin: 18px 0 0;
    color: var(--pfk-muted);
    font-size: 12px;
    line-height: 1.55;
    text-align: center;
  }

  @media (max-width: 760px) {

      padding: 18px 14px;
    }

    .pfk-thankyou__card {

      padding: 24px 20px 18px;
      border-right: 0;
      border-bottom: 1px solid rgba(19, 33, 58, .08);
    }

    }

    .pfk-thankyou__content {
      align-items: center;
      padding: 34px 24px 30px;
      text-align: center;
    }

    .pfk-thankyou__product-name {
      margin-bottom: 18px;
      font-size: 16px;
    }

    .pfk-thankyou__success {

      height: 58px;

      height: 31px;
    }

    .pfk-thankyou__eyebrow {
      font-size: 10px;
    }

    .pfk-thankyou__title {

    }

    .pfk-thankyou__intro {

      font-size: 15px;
      line-height: 1.6;
    }

    .pfk-thankyou__button {
      min-height: 56px;
      padding: 14px 20px;
    }
  }

  @media (max-width: 390px) {
    .pfk-thankyou {
      padding: 10px;
    }

      padding-inline: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .pfk-thankyou__button {
      transition: none;
    }
